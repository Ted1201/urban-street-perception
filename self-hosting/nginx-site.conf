# Standalone site configuration for an existing Linux Nginx installation.
# Replace example.com and the root path before enabling this site.
server {
    listen 80;
    server_name example.com;
    root /var/www/macau-street/dist;
    index index.html;
    charset utf-8;
    autoindex off;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
    location /photos/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ~ /\. {
        deny all;
    }
}
